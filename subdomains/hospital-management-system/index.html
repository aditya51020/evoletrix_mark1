<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hospital Management System | Evoletrix</title>
<meta name="description" content="Patient records, appointments, and billing for care teams. Built by Evoletrix — launching soon." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0b;
    --panel: #141416;
    --line: #26262a;
    --fg: #f4f4f5;
    --fg-muted: #9b9ba3;
    --fg-dim: #6a6a72;
    --brand: #2f6bff;
    --brand-cyan: #22d3ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--fg) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.06;
    pointer-events: none;
  }
  .brand {
    position: absolute;
    top: 28px;
    left: 28px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--fg);
    font-weight: 700;
    font-size: 15px;
  }
  main {
    position: relative;
    z-index: 1;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .icon-tile {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    box-shadow: 0 12px 28px rgba(239, 68, 68, 0.35);
  }
  .badge {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand-cyan);
    border: 1px solid color-mix(in srgb, var(--brand-cyan) 40%, transparent);
    border-radius: 20px;
    padding: 5px 14px;
  }
  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  p.tagline {
    color: var(--fg-muted);
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    padding: 13px 22px;
    border-radius: 6px;
    transition: transform 0.15s, background 0.15s;
  }
  a.btn-solid, a.btn-solid:visited {
    background: var(--fg);
    color: var(--bg);
  }
  .btn-solid:hover { transform: translateY(-1px); }
  a.btn-outline, a.btn-outline:visited {
    border: 1px solid var(--line);
    color: var(--fg-muted);
  }
  .btn-outline:hover { border-color: var(--fg); color: var(--fg); }
  footer {
    position: relative;
    z-index: 1;
    margin-top: 48px;
    font-size: 12px;
    color: var(--fg-dim);
    font-family: "JetBrains Mono", monospace;
  }
</style>
</head>
<body>
  <div class="dots" aria-hidden="true"></div>

  <a class="brand" href="https://evoletrix.com/">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
      <path d="M4 7 12 3l8 4v10l-8 4-8-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M4 7l8 4 8-4M12 11v10" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    Evoletrix
  </a>

  <main>
    <div class="icon-tile" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6l-9-4Z"/>
        <path d="M12 8v8M8 12h8"/>
      </svg>
    </div>

    <span class="badge">Launching soon</span>
    <h1>Hospital Management System</h1>
    <p class="tagline">Patient records, appointments, and billing for care teams — coordinating workflows across every department.</p>

    <div class="actions">
      <a class="btn btn-solid" href="https://evoletrix.com/#portfolio-page">View our portfolio</a>
      <a class="btn btn-outline" href="https://evoletrix.com/#top">Talk to us</a>
    </div>
  </main>

  <footer>© 2026 Evoletrix Private Limited</footer>
</body>
</html>
